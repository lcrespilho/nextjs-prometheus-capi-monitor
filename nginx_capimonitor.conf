map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream capimonitor {
    server localhost:1033;
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    add_header Alt-Svc 'h3=":443"; ma=2592000' always;
    server_name nextjsprometheuscapimonitor.louren.co.in;

    ssl_certificate /etc/letsencrypt/live/louren.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/louren.co.in/privkey.pem;

    location / {
        proxy_pass http://capimonitor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Standard headers for Next.js
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
