name: Deploy on GCP VM lourenco

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H louren.co.in > ~/.ssh/known_hosts
          cat ~/.ssh/id_rsa
          cat ~/.ssh/known_hosts
          cat ~/.ssh/id_rsa.pub
      - name: Deploy
        run: |
          ssh -T user@louren.co.in << EOF
            export PATH=/home/user/.nvm/versions/node/v23.11.0/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/games:/usr/games:/snap/bin
            cd /home/user/GitRepos/nextjs-prometheus-capi-monitor
            git pull
            npm install
            npm run build
            pm2 restart pm2_ecosystem.config.js
          EOF